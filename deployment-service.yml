apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-reg-app
  labels:
    app: student-reg
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-reg
  template:
    metadata:
      labels:
        app: student-reg
    spec:
      containers:
      - name: student-reg-container
        image: raviteja3929/student-reg-war:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"



apiVersion: v1
kind: Service
metadata:
  name: student-reg-service
spec:
  selector:
    app: student-reg
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

